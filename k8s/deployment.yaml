apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
      - name: demo-app
        image: ghcr.io/ddk1715/gitops-manifests1:ac697baef30f0294b908c2411a93d0ee3dd8dbce
        ports:
        - containerPort: 8080
